services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "58080:8080"
    volumes:
      - ./keycloak/mohamy-realm.json:/opt/keycloak/data/import/mohamy-realm.json:ro
