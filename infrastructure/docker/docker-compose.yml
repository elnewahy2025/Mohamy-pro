services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mohamy
      POSTGRES_PASSWORD: mohamy_password
      POSTGRES_DB: mohamy_pro
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mohamy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mc-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin && \
        mc mb --p local/mohamy-docs && \
        mc version enable local/mohamy-docs
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    ports:
      - "53310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/3310'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    ports:
      - "58200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/seal-status | grep -q '\"sealed\":false'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      cluster.name: mohamy-search
      node.name: mohamy-search-node
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "59200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s'"]
      interval: 15s
      timeout: 35s
      retries: 5
      start_period: 180s

  api:
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health/live').then((r) => { if (!r.ok) process.exit(1); })\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mc-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      vault:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mohamy:mohamy_password@postgres:5432/mohamy_pro?schema=public
      DIRECT_DATABASE_URL: postgresql://mohamy:mohamy_password@postgres:5432/mohamy_pro?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mohamy-docs
      S3_VERSIONING_ENABLED: "true"
      S3_OBJECT_LOCK_ENABLED: "false"
      S3_ENCRYPTION_MODE: NONE
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CORS_ORIGINS: http://localhost:5173
      # Dev-only session secret (>= 32 chars). Never use outside local development.
      SESSION_SECRET: mohamy-dev-session-secret-change-me-000
      # Future contracts (adapters fail closed until wired; see docs/DAEMON_WIRING_GUIDE.md):
      # OPENSEARCH_URL: http://opensearch:9200
      # VAULT_ADDR: http://vault:8200
      # VAULT_TOKEN: dev-root-token
      # VAULT_TRANSIT_KEY: mohamy-document-key
      # OCR_SERVICE_URL: http://paddleocr:8866
      # LIBREOFFICE_URL: http://libreoffice:3004
      # Operator-provided secrets (never commit): SESSION_SECRET, OIDC_ISSUER,
      # OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_REDIRECT_URI, METRICS_AUTH_TOKEN.

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  opensearch_data:
