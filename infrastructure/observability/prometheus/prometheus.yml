global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/mohamy-alerts.yml

scrape_configs:
  - job_name: mohamy-api
    metrics_path: /api/metrics
    scheme: http
    static_configs:
      - targets:
          - mohamy-api:3000
    bearer_token_file: /etc/prometheus/secrets/metrics_token
